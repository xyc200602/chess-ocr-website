<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际象棋手写记录识别系统</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chess libraries -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>♟️ 国际象棋手写记录识别系统</h1>
            <p class="subtitle">上传手写棋谱图片，自动生成PGN格式</p>
        </header>

        <!-- API Status -->
        <section id="apiStatusSection" class="api-status-section" style="display: none;">
            <div id="apiStatusContent"></div>
        </section>

        <!-- Loading Section -->
        <section id="loadingSection" class="loading-section" style="display: none;">
            <div class="spinner"></div>
            <p>正在识别中，请稍候...</p>
        </section>

        <!-- Main Workflow: Three Columns -->
        <main class="workflow-container">
            <!-- Left Column: Upload & Recognition -->
            <div class="workflow-column workflow-left">
                <div class="column-header">
                    <h2>📤 上传与识别</h2>
                </div>

                <!-- Upload Section -->
                <div class="workflow-card">
                    <h3>上传图片</h3>
                    <div class="upload-area" id="uploadArea">
                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <h4>拖放图片到这里</h4>
                        <p>或者点击选择文件</p>
                        <input type="file" id="fileInput" accept="image/*" hidden>
                        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                            选择图片
                        </button>
                    </div>

                    <!-- Preview Section -->
                    <div id="previewSection" class="preview-section" style="display: none;">
                        <h4>图片预览</h4>
                        <div class="preview-image-container">
                            <img id="previewImage" src="" alt="Preview" onclick="toggleImageZoom('previewImage')">
                            <div class="image-zoom-controls">
                                <button class="btn btn-small btn-secondary" onclick="toggleImageZoom('previewImage')" title="放大/还原">
                                    <span id="previewImageZoomIcon">🔍 放大</span>
                                </button>
                            </div>
                        </div>
                        <div class="button-group" style="margin-top: 10px;">
                            <button class="btn btn-primary" onclick="processImage()">开始识别</button>
                            <button class="btn btn-secondary btn-small" onclick="clearPreview()">清除</button>
                        </div>
                    </div>
                </div>

                <!-- Recognition Method Selection -->
                <div class="workflow-card">
                    <h3>识别方式</h3>
                    <div class="method-options">
                        <label class="method-option">
                            <input type="radio" name="method" value="glm" checked>
                            <div class="method-card">
                                <h4>🤖 GLM-4.6V 智能识别</h4>
                                <p>识别准确度高，支持长棋谱</p>
                            </div>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="method" value="ocr">
                            <div class="method-card">
                                <h4>🔍 Tesseract OCR</h4>
                                <p>传统OCR技术，无需API密钥</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Metadata Form -->
                <div class="workflow-card">
                    <h3>比赛信息（可选）</h3>
                    <form id="metadataForm" class="metadata-form">
                        <div class="form-group">
                            <label for="white">白方</label>
                            <input type="text" id="white" name="white" placeholder="White">
                        </div>
                        <div class="form-group">
                            <label for="black">黑方</label>
                            <input type="text" id="black" name="black" placeholder="Black">
                        </div>
                        <div class="form-group">
                            <label for="event">赛事</label>
                            <input type="text" id="event" name="event" placeholder="?">
                        </div>
                        <div class="form-group">
                            <label for="site">地点</label>
                            <input type="text" id="site" name="site" placeholder="?">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="date">日期</label>
                                <input type="date" id="date" name="date">
                            </div>
                            <div class="form-group">
                                <label for="round">轮次</label>
                                <input type="text" id="round" name="round" placeholder="?">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="result">结果</label>
                            <select id="result" name="result">
                                <option value="*">进行中</option>
                                <option value="1-0">白胜</option>
                                <option value="0-1">黑胜</option>
                                <option value="1/2-1/2">和棋</option>
                            </select>
                        </div>
                    </form>
                </div>

                <!-- Process Button -->
                <div class="workflow-card">
                    <button class="btn btn-large btn-primary btn-block" id="processBtn" onclick="processImage()" disabled>
                        开始识别
                    </button>
                </div>
            </div>

            <!-- Middle Column: Review Moves -->
            <div class="workflow-column workflow-middle">
                <div class="column-header">
                    <h2>✏️ 核对招法</h2>
                </div>

                <div id="resultsSection" class="results-section" style="display: none;">
                    <!-- Raw Text -->
                    <div class="workflow-card">
                        <h3>原始识别文本</h3>
                        <textarea id="rawText" class="textarea-small" placeholder="可以粘贴新的识别文本，旧内容会被覆盖"></textarea>
                        <button class="btn btn-primary btn-small" onclick="processRawText()" style="margin-top: 10px;">处理招法</button>
                    </div>

                    <!-- Extracted Moves -->
                    <div class="workflow-card">
                        <h3>识别出的着法 (<span id="moveCount">0</span> 步)</h3>
                        <div id="movesList" class="moves-list"></div>
                    </div>

                    <!-- Move Validation Result -->
                    <div class="workflow-card" id="validationBlock" style="display: none;">
                        <h3>招法验证结果</h3>
                        <div id="validationSummary" class="validation-summary"></div>
                        <div id="validatedMovesList" class="validated-moves-list"></div>
                    </div>
                </div>

                <!-- Manual Edit Section - Always visible, can be used for direct input or editing -->
                <div class="workflow-card">
                    <h3 id="movesEditTitle">手动编辑着法</h3>
                    <textarea id="movesEdit" placeholder="直接输入或粘贴招法，用空格分隔，例如: e4 e5 Nf3 Nc6" class="textarea-medium"></textarea>
                    <div class="button-group">
                        <button class="btn btn-primary" id="processMovesBtn" onclick="processDirectMoves()">处理招法</button>
                        <button class="btn btn-secondary" id="regenerateBtn" onclick="regeneratePGN()" style="display: none;">重新生成 PGN</button>
                    </div>
                </div>

                <div id="emptyMiddleSection" class="workflow-card empty-state" style="display: none;">
                    <p>👈 请先上传图片并开始识别，或直接在上方输入招法</p>
                </div>
            </div>

            <!-- Right Column: Board & Export -->
            <div class="workflow-column workflow-right">
                <div class="column-header">
                    <h2>♟️ 棋盘与导出</h2>
                </div>

                <div id="boardSection">
                    <!-- Chess Board -->
                    <div class="workflow-card">
                        <h3>棋盘局面</h3>
                        <div class="board-container">
                            <div id="chessboard" style="width: 100%; max-width: 400px; margin: 0 auto;"></div>
                        </div>
                        <div class="button-group" style="margin-top: 15px;">
                            <button class="btn btn-secondary btn-small" onclick="startEditingBoard()">编辑棋盘</button>
                            <button class="btn btn-secondary btn-small" onclick="flipBoard()">翻转棋盘</button>
                            <button class="btn btn-primary btn-small" onclick="generatePGNFromBoard()" id="generateFromBoardBtn" style="display: none;">从棋盘生成 PGN</button>
                        </div>
                    </div>

                    <!-- Position Navigator -->
                    <div id="positionNavigatorContainer"></div>

                    <!-- PGN Output -->
                    <div class="workflow-card">
                        <h3>PGN 格式输出</h3>
                        <textarea id="pgnOutput" class="textarea-medium"></textarea>
                        <div class="button-group">
                            <button class="btn btn-primary" onclick="copyPGN()">复制 PGN</button>
                            <button class="btn btn-secondary" onclick="downloadPGN()">下载 PGN 文件</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>提示: 请确保手写记录清晰可见，使用标准国际象棋代数记谱法</p>
        </footer>
    </div>

    <!-- Insert/Replace Dialog Modal -->
    <div id="insertReplaceModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>选择操作</h3>
            <p id="modalMoveText" style="margin: 15px 0; font-size: 1.1em; font-weight: bold;"></p>
            <p style="margin: 10px 0; color: var(--secondary-color);">请选择要执行的操作：</p>
            <div class="button-group" style="margin-top: 20px; justify-content: center;">
                <button id="insertBtn" class="btn btn-primary" style="min-width: 120px;">插入</button>
                <button id="replaceBtn" class="btn btn-secondary" style="min-width: 120px;">替换</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
